name: subscription_manager
description: "Track your recurring subscriptions and get reminders before they renew."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.4.3
  drift: ^2.35.2
  sqlite3_flutter_libs: ^0.5.42
  go_router: ^18.0.2
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1
  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  uuid: ^4.4.0
  path_provider: ^2.1.3
  dynamic_color: ^1.7.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true
  assets:
    - assets/services.json
    - assets/logos/